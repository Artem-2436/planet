<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xcortex World Pulse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0c0c0f;color:#e5e7eb;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;background:#0b1626}
.panel{background:rgba(12,12,15,.92);border:1px solid #27272a;border-radius:12px}
.tl-dark{filter:brightness(2.4) contrast(1.12) saturate(1.3)}
.tl-darklbl{filter:brightness(2.2)}
#pill{position:absolute;z-index:1000;top:8px;left:8px;display:flex;gap:10px;align-items:center;padding:7px 12px;font-size:13px;flex-wrap:wrap;max-width:calc(100% - 16px)}
.logo{font-weight:800}.logo b{color:#3b82f6}
.live{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#ef4444}
.live i{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.15}}
.cnt{font-size:12px;color:#a1a1aa}.cnt b{color:#fff}
#dock{position:absolute;z-index:1001;top:56px;left:8px;display:flex;flex-direction:column;gap:6px}
#dock button{width:46px;height:46px;border-radius:12px;font-size:20px;cursor:pointer;background:rgba(12,12,15,.92);border:1px solid #27272a;color:#fff}
#dock button.act{background:#1d4ed8;border-color:#3b82f6}
.fly{position:absolute;z-index:1000;top:56px;left:64px;display:none;padding:10px;max-width:calc(100% - 76px);width:340px;max-height:calc(100% - 70px);overflow-y:auto;flex-direction:column;gap:8px}
.fly.open{display:flex}
.fly h4{font-size:12px;color:#a1a1aa;text-transform:uppercase;letter-spacing:.5px}
.wrapc{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--c);color:#fff;background:transparent;padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;display:flex;gap:5px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{background:color-mix(in srgb,var(--c) 25%,transparent)}.chip.off{opacity:.35}
#q{width:100%;background:#18181b;border:1px solid #27272a;color:#fff;padding:8px 10px;border-radius:8px;outline:none;font:inherit}
button.b{background:#18181b;border:1px solid #27272a;color:#e5e7eb;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left}
button.b:hover,button.b.act{background:#1d4ed8;border-color:#3b82f6;color:#fff}
.lbl{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
a.back{color:#93c5fd;text-decoration:none;font-size:13px;border:1px solid #27272a;padding:8px 10px;border-radius:8px;display:block}
.src{font-size:12px;color:#a1a1aa;display:flex;justify-content:space-between;gap:8px}.src.ok b{color:#34d399}.src.bad b{color:#f87171}
#side{position:absolute;z-index:1000;top:8px;right:8px;bottom:8px;width:320px;display:none;flex-direction:column;overflow:hidden}
#side.open{display:flex}
#side h3{padding:10px 12px;font-size:13px;border-bottom:1px solid #27272a;display:flex;justify-content:space-between;align-items:center}
#list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.card{padding:9px 12px;border-bottom:1px solid #1f1f23;border-left:4px solid var(--c);cursor:pointer}
.card:hover{background:#18181b}
.card .t{font-weight:600;font-size:13px}.card .m{font-size:11px;color:#a1a1aa;display:flex;justify-content:space-between;gap:6px}
#toast{position:absolute;z-index:1100;left:50%;top:12px;transform:translateX(-50%);padding:8px 14px;display:none;font-weight:600;max-width:90%;text-align:center}
#modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px}
#modal .box{background:#0c0c0f;border:1px solid #27272a;border-radius:14px;padding:16px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
#modal input,#modal textarea{background:#18181b;border:1px solid #27272a;color:#fff;padding:8px;border-radius:8px;font:inherit;width:100%}
.dots{display:flex;gap:8px}.dots label{cursor:pointer}.dots input{display:none}
.dots span{display:block;width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid transparent}
.dots input:checked+span{border-color:#fff}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0c0c0f;color:#e5e7eb;border:1px solid #27272a}
.pp b{font-size:14px}.pp p{margin:4px 0;font-size:12px;color:#d4d4d8}.pp small{color:#a1a1aa}.pp a{color:#93c5fd}
.add-mode .leaflet-container{cursor:crosshair}
.geo{white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000;letter-spacing:1px}
.geo.c{color:#fff;font-size:15px;text-transform:uppercase}
.geo.o{color:#7dd3fc;font-size:13px;font-style:italic;font-weight:700}
.geo.s{color:#a5f3fc;font-size:11px;font-style:italic;font-weight:600;letter-spacing:.3px}
@media(max-width:760px){
 #side{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:42vh}
 .fly{width:auto;right:8px}
 #pill{font-size:12px;gap:8px;padding:6px 10px}
 .geo.c{font-size:12px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="pill" class="panel">
 <span class="logo">Xcortex <b>World Pulse</b></span>
 <span class="live"><i></i>LIVE</span>
 <span class="cnt">Меток: <b id="cnt">0</b></span>
 <span class="cnt" id="kp" title="Планетарный K-индекс (NOAA SWPC)">Kp: <b>…</b></span>
</div>

<div id="dock">
 <button data-p="pF" title="Фильтры и поиск">🔍</button>
 <button data-p="side" title="Лента событий">📋</button>
 <button data-p="pL" title="Слои карты">🗺️</button>
 <button data-p="pR" title="Регионы">🧭</button>
 <button data-p="pT" title="Инструменты и источники">🛠️</button>
</div>

<div id="pF" class="fly panel">
 <h4>Категории</h4>
 <div id="chips" class="wrapc"></div>
 <label class="lbl"><input type="checkbox" id="ckS" checked> Постоянные объекты (ЦОД, космодромы, науч. центры)</label>
 <h4>Поиск</h4>
 <input id="q" placeholder="Страна, город или событие…" autocomplete="off">
</div>

<div id="pL" class="fly panel">
 <h4>Тип карты</h4>
 <button class="b act" data-l="dark">🌑 Тактический</button>
 <button class="b" data-l="sat">🛰️ Спутник</button>
 <button class="b" data-l="light">☀️ Светлый</button>
 <h4>Детализация</h4>
 <label class="lbl"><input type="checkbox" id="ckB" checked> Границы стран</label>
 <label class="lbl"><input type="checkbox" id="ckRU"> 🇷🇺 Регионы России (субъекты РФ)</label>
 <label class="lbl"><input type="checkbox" id="ckG" checked> Названия материков и морей</label>
</div>

<div id="pR" class="fly panel">
 <h4>Перелёт по регионам</h4>
 <div id="regions" style="display:flex;flex-direction:column;gap:6px"></div>
</div>

<div id="pT" class="fly panel">
 <h4>Инструменты</h4>
 <button class="b" id="bAdd">＋ Добавить событие на карту</button>
 <button class="b" id="bRuler">📏 Радар / линейка расстояний</button>
 <button class="b" id="bExp">⬇ Экспорт меток (JSON)</button>
 <button class="b" id="bImp">⬆ Импорт меток (JSON)</button>
 <h4>Источники данных (реальные)</h4>
 <div id="srcs"></div>
 <a class="back" href="https://xcortex.duckdns.org" target="_blank" rel="noopener">← Назад в Xcortex Studio</a>
</div>

<div id="side" class="panel">
 <h3><span>Лента событий</span><button class="b" id="bX">✕</button></h3>
 <div id="list"></div>
</div>
<div id="toast" class="panel"></div>

<div id="modal"><div class="box">
 <b>Новый маяк</b>
 <small id="mpos" style="color:#a1a1aa"></small>
 <div class="dots" id="mdots"></div>
 <input id="mt" placeholder="Заголовок" maxlength="80">
 <textarea id="md" rows="3" placeholder="Описание" maxlength="400"></textarea>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="b" id="mc">Отмена</button><button class="b act" id="ms">Сохранить</button></div>
</div></div>
<input type="file" id="file" accept="application/json" style="display:none">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
var CATS={
 red:{c:'#ef4444',n:'Катаклизмы и ЧП'},
 orange:{c:'#f97316',n:'Погода / геомагнитка'},
 blue:{c:'#3b82f6',n:'Технологии / ЦОД'},
 purple:{c:'#a855f7',n:'Космос'},
 green:{c:'#10b981',n:'Наука / экология'}
};
var MAXM=400,LS='xcortex_world_pulse_beacons';
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var mobile=function(){return innerWidth<=760};

/* ---------- Карта ---------- */
var map=L.map('map',{preferCanvas:true,worldCopyJump:true,zoomControl:false,minZoom:2,maxZoom:18,center:[40,40],zoom:2.5,zoomSnap:.5,wheelPxPerZoomLevel:90});
L.control.zoom({position:'bottomleft'}).addTo(map);
var CR='&copy; OpenStreetMap &copy; CARTO',ES='&copy; Esri';
function T(u,o){o=o||{};o.maxNativeZoom=o.maxNativeZoom||19;o.maxZoom=19;o.keepBuffer=3;return L.tileLayer(u,o)}
var CD='https://{s}.basemaps.cartocdn.com/';
var BASES={
 dark:L.layerGroup([
  T(CD+'dark_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',attribution:CR,className:'tl-dark'}),
  T(CD+'dark_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',className:'tl-darklbl',pane:'shadowPane'})]),
 sat:L.layerGroup([
  T('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:ES,maxNativeZoom:18}),
  T('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,pane:'shadowPane'})]),
 light:L.layerGroup([T(CD+'rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',attribution:CR})])
};
var curL='dark';BASES.dark.addTo(map);
document.querySelectorAll('#pL [data-l]').forEach(function(b){
 b.onclick=function(){
  map.removeLayer(BASES[curL]);curL=b.dataset.l;BASES[curL].addTo(map);
  BASES[curL].eachLayer(function(l){if(l.bringToBack&&!l.options.pane)l.bringToBack()});
  document.querySelectorAll('#pL [data-l]').forEach(function(x){x.classList.toggle('act',x===b)});
  styleBorders();
 };
});

/* границы стран */
map.createPane('borders').style.zIndex=300;
map.getPane('borders').style.pointerEvents='none';
map.createPane('ruPane').style.zIndex=305;
map.getPane('ruPane').style.pointerEvents='none';
var borders=null,bOn=true,ruL=null,ruOn=false,ruLoading=false;
function styleBorders(){
 if(borders)borders.setStyle({color:curL==='light'?'#334155':curL==='sat'?'#fde68a':'#93c5fd',weight:1,opacity:.85,fill:false,interactive:false});
 if(ruL)ruL.setStyle({color:curL==='light'?'#b91c1c':'#fca5a5',weight:1.1,opacity:.9,fillColor:'#ef4444',fillOpacity:.07,interactive:false});
}
fetch('https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json').then(function(r){return r.json()}).then(function(g){
 borders=L.geoJSON(g,{pane:'borders',renderer:L.canvas({pane:'borders'}),interactive:false});
 styleBorders();if(bOn)borders.addTo(map);
}).catch(function(){});
$('ckB').onchange=function(){bOn=this.checked;if(borders){bOn?borders.addTo(map):map.removeLayer(borders)}};

/* регионы России (Highcharts Map Collection / Natural Earth) */
var RU_URLS=['https://code.highcharts.com/mapdata/countries/ru/ru-all.geo.json','https://www.floodsmart.gov/libraries/highcharts--map-collection/countries/ru/ru-all.geo.json'];
function loadRU(cb,i){
 i=i||0;
 if(ruL){cb&&cb();return}
 if(ruLoading)return;ruLoading=true;
 fetch(RU_URLS[i]).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(g){
  ruL=L.geoJSON(g,{pane:'ruPane',renderer:L.canvas({pane:'ruPane'}),interactive:false});
  styleBorders();ruLoading=false;cb&&cb();
 }).catch(function(){
  ruLoading=false;
  if(i+1<RU_URLS.length)loadRU(cb,i+1);else toast('Не удалось загрузить регионы России');
 });
}
function setRU(v){
 ruOn=v;$('ckRU').checked=v;
 if(v){loadRU(function(){if(ruOn)ruL.addTo(map)})}
 else if(ruL)map.removeLayer(ruL);
}
$('ckRU').onchange=function(){setRU(this.checked)};

/* подписи материков, океанов, морей */
var GEO=[
 ['Азия',48,90,'c',0],['Европа',54,20,'c',0],['Африка',5,20,'c',0],['Северная Америка',48,-100,'c',0],['Южная Америка',-14,-60,'c',0],['Австралия и Океания',-25,134,'c',0],['Антарктида',-80,0,'c',0],
 ['Тихий океан',8,-140,'o',0],['Тихий океан',-10,175,'o',0],['Атлантический океан',12,-35,'o',0],['Атлантический океан',-25,-15,'o',0],['Индийский океан',-18,80,'o',0],['Северный Ледовитый океан',82,-10,'o',0],['Южный океан',-62,100,'o',0],
 ['Средиземное море',34.5,18,'s',3],['Чёрное море',43.5,34,'s',3],['Каспийское море',41.5,51,'s',3],['Балтийское море',58,20,'s',3],['Северное море',56,3,'s',3],['Красное море',20,38,'s',3],['Карибское море',15,-74,'s',3],['Аравийское море',15,64,'s',3],['Южно-Китайское море',12,114,'s',3],['Японское море',40,134,'s',3],['Берингово море',58,-175,'s',3],['Охотское море',55,147,'s',3],['Баренцево море',73,38,'s',3],['Карское море',75,80,'s',3],['Море Лаптевых',76,125,'s',3],['Восточно-Сибирское море',73,160,'s',3],['Белое море',65.5,38,'s',3],['Мексиканский залив',25,-90,'s',3],['Персидский залив',27,51,'s',3],['Бенгальский залив',15,89,'s',3],['Гудзонов залив',60,-85,'s',3],['Жёлтое море',36,123,'s',3],['Норвежское море',68,2,'s',3],['Тасманово море',-38,160,'s',3],['Коралловое море',-17,155,'s',3]
];
var geoG=L.layerGroup().addTo(map),gOn=true;
function updGeo(){
 geoG.clearLayers();if(!gOn)return;
 var z=map.getZoom();
 GEO.forEach(function(g){
  var t=g[3];
  if((t==='c'||t==='o')&&z>5)return;
  if(t==='s'&&(z<g[4]||z>7))return;
  L.marker([g[1],g[2]],{interactive:false,keyboard:false,icon:L.divIcon({className:'geo '+t,html:g[0],iconSize:[0,0]})}).addTo(geoG);
 });
}
map.on('zoomend',updGeo);updGeo();
$('ckG').onchange=function(){gOn=this.checked;updGeo()};

/* ---------- Состояние ---------- */
var events=[],user=[],active={red:1,orange:1,blue:1,purple:1,green:1},query='',showStatic=true;
var group=L.layerGroup().addTo(map),halos=L.layerGroup().addTo(map),markers={};
try{user=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){user=[]}
if(!Array.isArray(user))user=[];
function saveUser(){try{localStorage.setItem(LS,JSON.stringify(user))}catch(e){}}

/* ---------- Панели ---------- */
var PANELS=['pF','pL','pR','pT','side'];
function openP(id,force){
 var el=$(id),willOpen=force!==undefined?force:!el.classList.contains('open');
 PANELS.forEach(function(p){if(p!==id&&(mobile()||(p!=='side'&&id!=='side')))$(p).classList.remove('open')});
 el.classList.toggle('open',willOpen);syncDock();
}
function syncDock(){document.querySelectorAll('#dock button').forEach(function(b){b.classList.toggle('act',$(b.dataset.p).classList.contains('open'))})}
document.querySelectorAll('#dock button').forEach(function(b){b.onclick=function(){openP(b.dataset.p)}});
$('bX').onclick=function(){openP('side',false)};
map.on('click',function(){if(mobile()&&!addOn&&!rulerOn){PANELS.forEach(function(p){$(p).classList.remove('open')});syncDock()}});

Object.keys(CATS).forEach(function(k){
 var b=document.createElement('button');b.className='chip on';b.style.setProperty('--c',CATS[k].c);
 b.innerHTML='<i></i>'+CATS[k].n;
 b.onclick=function(){active[k]=active[k]?0:1;b.classList.toggle('off',!active[k]);b.classList.toggle('on',!!active[k]);render()};
 $('chips').appendChild(b);
});
$('ckS').onchange=function(){showStatic=this.checked;render()};

/* ---------- Утилиты ---------- */
function dur(s){if(s<60)return s+' сек';if(s<3600)return(s/60|0)+' мин';if(s<86400)return(s/3600|0)+' ч';return(s/86400|0)+' д'}
function ago(e){
 if(e.static)return'постоянный объект';
 var s=((Date.now()-e.t)/1000)|0;
 return s<0?'через '+dur(-s):dur(s)+' назад';
}
function toast(t,ms){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},ms||3500)}
function fmtC(a,b){return Math.abs(a).toFixed(2)+'°'+(a>=0?'N':'S')+' '+Math.abs(b).toFixed(2)+'°'+(b>=0?'E':'W')}
function haversine(a,b){var R=6371.0088,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
 var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)*Math.sin(dLo/2);
 return 2*R*Math.asin(Math.sqrt(h))}
function arc(a,b,n){var r=Math.PI/180,d=180/Math.PI;
 function v(p){var la=p.lat*r,lo=p.lng*r;return[Math.cos(la)*Math.cos(lo),Math.cos(la)*Math.sin(lo),Math.sin(la)]}
 var A=v(a),B=v(b),dot=Math.max(-1,Math.min(1,A[0]*B[0]+A[1]*B[1]+A[2]*B[2])),om=Math.acos(dot),pts=[],pl=a.lng;
 for(var i=0;i<=n;i++){var f=i/n,s=Math.sin(om)||1e-9,k1=Math.sin((1-f)*om)/s,k2=Math.sin(f*om)/s;
  var x=k1*A[0]+k2*B[0],y=k1*A[1]+k2*B[1],z=k1*A[2]+k2*B[2];
  var la=Math.atan2(z,Math.sqrt(x*x+y*y))*d,lo=Math.atan2(y,x)*d;
  while(lo-pl>180)lo-=360;while(lo-pl<-180)lo+=360;pl=lo;pts.push([la,lo])}
 return pts}
function safeUrl(u){return/^https?:\/\//i.test(u||'')?u:''}

/* ---------- Статус источников ---------- */
var ST={};
function srcStatus(name,ok,n){ST[name]={ok:ok,n:n,t:Date.now()};
 $('srcs').innerHTML=Object.keys(ST).map(function(k){var s=ST[k];
  return'<div class="src '+(s.ok?'ok':'bad')+'"><span>'+esc(k)+'</span><b>'+(s.ok?'✓ '+s.n:'✗ нет связи')+'</b></div>'}).join('');
}
/* заменить события одного источника; не перерисовывать, если ничего не изменилось */
var sigs={};
function setSrc(name,arr){
 var sig=arr.map(function(e){return e.id}).join(',');
 srcStatus(name,true,arr.length);
 if(sigs[name]===sig)return;sigs[name]=sig;
 events=events.filter(function(e){return e.src!==name}).concat(arr);render();
}

/* ---------- Реальные данные ---------- */
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}

/* USGS: землетрясения за сутки (M2.5+) и значимые за неделю (M4.5+) */
function loadUSGS(){
 var U='https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/';
 Promise.all([getJSON(U+'2.5_day.geojson'),getJSON(U+'4.5_week.geojson')]).then(function(r){
  var seen={},out=[];
  r.forEach(function(j){(j.features||[]).forEach(function(f){
   if(seen[f.id])return;seen[f.id]=1;
   var m=f.properties.mag||2.5,c=f.geometry.coordinates;
   out.push({id:'q'+f.id,cat:'red',src:'USGS',title:'Землетрясение M'+m.toFixed(1),place:f.properties.place||'',
    desc:'Глубина: '+(c[2]||0).toFixed(0)+' км.',url:safeUrl(f.properties.url),
    lat:c[1],lng:c[0],sev:Math.min(5,Math.max(1,Math.round(m-2))),t:f.properties.time})})});
  setSrc('USGS',out);
 }).catch(function(){srcStatus('USGS',false,0)});
}

/* NASA EONET: открытые природные события за 30 дней */
var EO={
 wildfires:['red','Лесной пожар',3],volcanoes:['red','Вулкан',4],landslides:['red','Оползень',3],floods:['red','Наводнение',3],manmade:['red','Техногенное событие',3],
 severeStorms:['orange','Сильный шторм',4],tempExtremes:['orange','Температурная аномалия',3],dustHaze:['orange','Пыль / дымка',2],drought:['orange','Засуха',3],snow:['orange','Снегопад',2],
 seaLakeIce:['green','Морской / озёрный лёд',2],waterColor:['green','Изменение цвета воды',2]
};
function pt(c){while(Array.isArray(c[0]))c=c[0];return c}
function loadEONET(){
 getJSON('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days=30&limit=500').then(function(j){
  var out=[];
  (j.events||[]).forEach(function(ev){
   var g=ev.geometry&&ev.geometry[ev.geometry.length-1];if(!g)return;
   var c=pt(g.coordinates),cid=ev.categories&&ev.categories[0]&&ev.categories[0].id,m=EO[cid];
   if(!m||!isFinite(c[0])||!isFinite(c[1]))return;
   out.push({id:'e'+ev.id,cat:m[0],src:'NASA EONET',title:m[1]+' — '+ev.title,place:'',
    desc:'Открытое событие по данным NASA EONET.',url:safeUrl(ev.sources&&ev.sources[0]&&ev.sources[0].url),
    lat:c[1],lng:c[0],sev:m[2],t:Date.parse(g.date)||Date.now()});
  });
  setSrc('NASA EONET',out);
 }).catch(function(){srcStatus('NASA EONET',false,0)});
}

/* Launch Library 2: ближайшие и недавние запуски */
function loadLaunches(){
 var B='https://ll.thespacedevs.com/2.2.0/launch/';
 Promise.all([getJSON(B+'upcoming/?limit=30'),getJSON(B+'previous/?limit=20')]).then(function(r){
  var out=[],seen={};
  r.forEach(function(j,k){(j.results||[]).forEach(function(l){
   var p=l.pad||{},la=parseFloat(p.latitude),lo=parseFloat(p.longitude);
   if(!isFinite(la)||!isFinite(lo)||seen[l.id])return;seen[l.id]=1;
   var t=Date.parse(l.net)||Date.now(),soon=k===0&&t-Date.now()<172800000;
   out.push({id:'l'+l.id,cat:'purple',src:'Launch Library 2',title:'Запуск: '+l.name,
    place:(p.location&&p.location.name)||p.name||'',
    desc:'Статус: '+((l.status&&l.status.name)||'—')+'. Оператор: '+((l.launch_service_provider&&l.launch_service_provider.name)||'—')+'.',
    lat:la,lng:lo,sev:soon?4:k===0?2:3,t:t});
  })});
  setSrc('Launch Library 2',out);
 }).catch(function(){srcStatus('Launch Library 2',false,0)});
}

/* МКС в реальном времени */
function loadISS(){

  e.lat=j.latitude;e.lng=j.longitude;e.desc=desc;e.t=Date.now();srcStatus('МКС',true,1);
  var m=markers.iss;if(m){m.setLatLng([e.lat,e.lng]);if(m.isPopupOpen())m.getPopup().setContent(popupHTML(e))}
 }).catch(function(){srcStatus('МКС',false,0)});
}

/* NOAA: планетарный K-индекс */
function loadKp(){
 getJSON('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json').then(function(j){
  var r=j[j.length-1],kp=parseFloat(r[1]);if(!isFinite(kp))throw 0;
  var lvl=kp>=7?'сильная буря':kp>=5?'геомагнитная буря':kp>=4?'возмущённо':'спокойно';
  $('kp').innerHTML='Kp: <b style="color:'+(kp>=5?'#f97316':'#fff')+'">'+kp.toFixed(1)+'</b> '+lvl;
  srcStatus('NOAA Kp',true,1);
 }).catch(function(){srcStatus('NOAA Kp',false,0)});
}

/* ---------- Отрисовка ---------- */
function all(){return events.concat(user)}
function matches(e){
 if(!active[e.cat])return false;
 if(!query)return true;
 return((e.title||'')+' '+(e.place||'')+' '+(e.desc||'')+' '+CATS[e.cat].n).toLowerCase().indexOf(query)>-1;
}
function popupHTML(e){
 return '<div class="pp"><b style="color:'+CATS[e.cat].c+'">'+esc(e.title)+'</b><p>'+esc(e.desc||'')+'</p><small>'+esc(e.place||'')+(e.place?' · ':'')+fmtC(e.lat,e.lng)+'<br>'+esc(ago(e))+(e.static?'':' · важность '+e.sev+'/5')+' · '+(e.src==='USER'?'мой маяк':esc(e.src))+'</small>'
  +(e.url?'<br><a href="'+esc(e.url)+'" target="_blank" rel="noopener">Источник →</a>':'')
  +(e.src==='USER'?'<br><button class="b" data-del="'+esc(e.id)+'" style="margin-top:6px">Удалить</button>':'')+'</div>';
}
var shown=[],rt=0,haloList=[];
function render(){if(rt)return;rt=setTimeout(function(){rt=0;doRender()},80)}
function doRender(){
 var us=user.filter(matches),live=events.filter(function(e){return matches(e)}).sort(function(a,b){return b.t-a.t}).slice(0,Math.max(0,MAXM-us.length));
 var st=showStatic?STATIC.filter(matches):[];
 shown=us.concat(live,st);
 group.clearLayers();halos.clearLayers();markers={};haloList=[];
 shown.forEach(function(e,i){
  var col=CATS[e.cat].c,r=e.static?5:4+e.sev*2.4;
  var m=L.circleMarker([e.lat,e.lng],{radius:r,color:'#fff',weight:e.static?1:1.2,fillColor:col,fillOpacity:e.static?.6:.85,bubblingMouseEvents:false});
  m.bindPopup(function(){return popupHTML(e)},{maxWidth:270});
  m.on('click',function(){if(rulerOn){addPt(m.getLatLng());return}m.openPopup()});
  m.addTo(group);markers[e.id]=m;
  if(!e.static&&i<14){var h=L.circleMarker([e.lat,e.lng],{radius:r,color:col,weight:2,fillOpacity:0,interactive:false});h.addTo(halos);haloList.push({h:h,r:r,p:Math.random()})}
 });
 $('cnt').textContent=shown.length;
 $('list').innerHTML=shown.slice(0,300).map(function(e){
  return '<div class="card" style="--c:'+CATS[e.cat].c+'" data-id="'+esc(e.id)+'"><div class="t">'+esc(e.title)+'</div><div class="m"><span>'+esc(e.place||fmtC(e.lat,e.lng))+'</span><span>'+esc(ago(e))+'</span></div><div class="m"><span>'+esc(e.src==='USER'?'Мой маяк':e.src)+'</span><span>'+CATS[e.cat].n+'</span></div></div>';
 }).join('')||'<div style="padding:14px;color:#a1a1aa">Ничего не найдено</div>';
}
(function(){
 var last=0;
 function f(ts){
  if(ts-last>50&&!document.hidden){last=ts;
   for(var i=0;i<haloList.length;i++){var o=haloList[i];o.p=(o.p+.025)%1;
    o.h.setRadius(o.r+o.p*16);o.h.setStyle({opacity:1-o.p})}}
  requestAnimationFrame(f)}
 requestAnimationFrame(f);
})();

function focusEvent(id){
 var e=all().concat(STATIC).filter(function(x){return x.id===id})[0],m=markers[id];if(!e||!m)return;
 if(mobile())openP('side',false);
 map.flyTo([e.lat,e.lng],Math.max(map.getZoom(),5),{duration:1.2});
 map.once('moveend',function(){m.openPopup()});
}
$('list').onclick=function(ev){var c=ev.target.closest('.card');if(c)focusEvent(c.dataset.id)};
map.on('popupopen',function(ev){
 var b=ev.popup.getElement().querySelector('[data-del]');
 if(b)b.onclick=function(){user=user.filter(function(x){return x.id!==b.dataset.del});saveUser();map.closePopup();doRender()};
});

/* ---------- Добавление маяка ---------- */
var addOn=false,pend=null,selCat='green';
Object.keys(CATS).forEach(function(k){
 var l=document.createElement('label');l.style.setProperty('--c',CATS[k].c);l.title=CATS[k].n;

/* ---------- Линейка ---------- */
var rulerOn=false,rp=[],rg=L.layerGroup().addTo(map);
function toggleRuler(){
 rulerOn=!rulerOn;$('bRuler').classList.toggle('act',rulerOn);
 if(rulerOn&&addOn)setAdd(false);
 if(!rulerOn){rg.clearLayers();rp=[]}else{openP('pT',false);toast('Выберите 2 точки на карте или 2 события')}
}
$('bRuler').onclick=toggleRuler;
function addPt(ll){
 if(rp.length>=2){rg.clearLayers();rp=[]}
 rp.push({lat:ll.lat,lng:ll.lng});
 L.circleMarker(ll,{radius:5,color:'#fff',weight:2,fillColor:'#3b82f6',fillOpacity:1,interactive:false}).addTo(rg);
 if(rp.length===2){
  var d=haversine(rp[0],rp[1]);
  L.polyline(arc(rp[0],rp[1],64),{color:'#38bdf8',weight:3,dashArray:'8 8',interactive:false}).addTo(rg);
  toast('Расстояние: '+Math.round(d).toLocaleString('ru-RU')+' км',8000);
 }
}
map.on('click',function(ev){
 if(rulerOn){addPt(ev.latlng);return}
 if(addOn){pend=ev.latlng;$('mpos').textContent=fmtC(pend.lat,pend.lng);$('modal').style.display='flex'}
});

/* ---------- Экспорт / импорт ---------- */
$('bExp').onclick=function(){
 var blob=new Blob([JSON.stringify(user,null,2)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='xcortex-world-pulse-beacons.json';document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(a.href)},1000);toast('Экспортировано меток: '+user.length);
};
$('bImp').onclick=function(){$('file').click()};
$('file').onchange=function(){
 var f=this.files[0];if(!f)return;var rd=new FileReader();
 rd.onload=function(){
  try{
   var arr=JSON.parse(rd.result),n=0;if(!Array.isArray(arr))throw 0;
   arr.forEach(function(x){
    if(x&&CATS[x.cat]&&isFinite(x.lat)&&isFinite(x.lng)&&x.title){
     user.push({id:'u'+Date.now()+Math.random().toString(36).slice(2,6),cat:x.cat,src:'USER',title:String(x.title).slice(0,80),desc:String(x.desc||'').slice(0,400),place:'Мой маяк',lat:+x.lat,lng:+x.lng,sev:3,t:+x.t||Date.now()});n++}
   });
   saveUser();doRender();toast('Импортировано меток: '+n);
  }catch(e){toast('Неверный JSON-файл')}
 };
 rd.readAsText(f);this.value='';
};

loadUSGS();loadEONET();loadLaunches();loadISS();loadKp();

})();
